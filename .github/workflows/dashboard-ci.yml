name: Dashboard CI

# No `paths:` filter on pull_request, deliberately.
#
# A path-filtered workflow is skipped entirely on PRs that miss the filter, and
# a skipped workflow never reports a status. Once this check is marked required
# in a ruleset, every PR that doesn't touch dashboard/ would sit forever on
# "Expected — Waiting for status to be reported" and could not be merged. The
# alternative (a third-party changed-files action, or a paths-filter plus a
# dummy "success" job) adds a dependency and a branch of logic whose only job is
# to defeat the filter it just added.
#
# The honest trade is cost: this installs, builds, and runs 40 tests on every
# PR. For a project this size that is a couple of minutes of a free runner —
# cheaper than the machinery required to skip it correctly.
on:
  pull_request:
  push:
    # main is the integration branch; demo-build is the branch the public Vercel
    # demo deploys from. Both are branches whose broken state is visible, so
    # both get a post-merge signal.
    branches:
      - main
      - demo-build

# Least privilege: this job only reads the tree. It never writes to the repo,
# publishes anything, or comments on pull requests.
permissions:
  contents: read

concurrency:
  # Pull requests share one group per PR ref, so a new push to the head
  # supersedes the run under review. Pushes get their own group per commit SHA,
  # so two post-merge runs never share a group at all.
  #
  # The per-SHA split — not `cancel-in-progress` — is what actually protects
  # push runs. `cancel-in-progress: false` only spares a run that is already
  # *in progress*; a second run in the same group sits `pending`, and "any
  # existing pending job or workflow in the same concurrency group will be
  # canceled" when a third joins it. Three quick merges to main under one
  # ref-keyed group would therefore have cancelled the middle commit's run —
  # the exact gap this policy exists to close. Distinct groups per commit
  # remove the queue, so nothing is ever pending behind anything.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  # Superseding an in-flight run is right for a PR: only the newest push to a
  # branch under review needs an answer. It is wrong for push, where each run is
  # the record for one commit that already landed on main or demo-build —
  # cancelling those leaves a merged commit with no CI result. This expression
  # is false for every push event, so it never cancels one.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    name: build + test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: dashboard
    steps:
      # Actions are pinned to the commit SHA behind the tag in the comment, so
      # a retagged release cannot silently change what runs here.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No later step needs the token; don't leave it in .git/config.
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # dashboard/package.json is the single place the Node major is
          # declared. setup-node v7 resolves a package.json passed here in a
          # documented order — `volta.node`, then `devEngines.runtime`, then
          # `engines.node`, then following `volta.extends`
          # (setup-node docs/advanced-usage.md, "Node version file"). This
          # package.json sets only `engines.node`, which is also the field
          # Vercel reads, so CI and the deploy resolve the same declaration.
          #
          # There is deliberately no `node-version:` alongside this. When both
          # inputs are set, setup-node uses `node-version` and ignores the file
          # (it only logs a warning), so adding a literal back would silently
          # re-create the drift this removes.
          #
          # `engines.node` is `24.x` rather than an exact patch because Vercel
          # offers only major versions and "automatically rolls out minor and
          # patch updates" — the deploy this build stands in for always runs
          # the latest 24.x. Pinning a patch would test a toolchain Vercel
          # never promises.
          #
          # Path is relative to the workspace root, not the job
          # working-directory: setup-node joins it onto GITHUB_WORKSPACE.
          node-version-file: dashboard/package.json
          cache: npm
          # Also relative to the workspace root.
          cache-dependency-path: dashboard/package-lock.json

      # npm ci refuses to run when package.json and package-lock.json disagree,
      # and installs exactly what the lockfile pins. `npm install` does neither.
      - name: Install (lockfile-strict)
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
