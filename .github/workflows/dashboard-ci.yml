name: Dashboard CI

# No `paths:` filter on pull_request, deliberately.
#
# A path-filtered workflow is skipped entirely on PRs that miss the filter, and
# a skipped workflow never reports a status. Once this check is marked required
# in a ruleset, every PR that doesn't touch dashboard/ would sit forever on
# "Expected — Waiting for status to be reported" and could not be merged. The
# alternative (a third-party changed-files action, or a paths-filter plus a
# dummy "success" job) adds a dependency and a branch of logic whose only job is
# to defeat the filter it just added.
#
# The honest trade is cost: this installs, builds, and runs 40 tests on every
# PR. For a project this size that is a couple of minutes of a free runner —
# cheaper than the machinery required to skip it correctly.
on:
  pull_request:
  push:
    # main is the integration branch; demo-build is the branch the public Vercel
    # demo deploys from. Both are branches whose broken state is visible, so
    # both get a post-merge signal.
    branches:
      - main
      - demo-build

# Least privilege: this job only reads the tree. It never writes to the repo,
# publishes anything, or comments on pull requests.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseding an in-flight run is right for a PR: only the newest push to a
  # branch under review needs an answer. It is wrong for push, where each run is
  # the record for one commit that already landed on main or demo-build —
  # cancelling those leaves a merged commit with no CI result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    name: build + test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: dashboard
    steps:
      # Actions are pinned to the commit SHA behind the tag in the comment, so
      # a retagged release cannot silently change what runs here.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No later step needs the token; don't leave it in .git/config.
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Keep this literal in sync with `engines.node` in
          # dashboard/package.json — same Node major, declared in both places.
          #
          # It is written out rather than read via `node-version-file:
          # package.json` because the setup-node README lists package.json as an
          # accepted file without documenting which field it reads, and this
          # workflow should not depend on undocumented parsing.
          #
          # `24.x` rather than an exact patch because Vercel only offers major
          # versions and "automatically rolls out minor and patch updates" — the
          # deploy that this build is a proxy for always runs the latest 24.x.
          # Pinning a patch here would test a toolchain Vercel never promises.
          node-version: '24.x'
          cache: npm
          # Relative to the workspace root, not the job working-directory.
          cache-dependency-path: dashboard/package-lock.json

      # npm ci refuses to run when package.json and package-lock.json disagree,
      # and installs exactly what the lockfile pins. `npm install` does neither.
      - name: Install (lockfile-strict)
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
