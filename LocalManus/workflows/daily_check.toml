# =============================================================================
# ManusLocal — Daily Proactive Check Workflow
# Runs 3x daily (9am, 1pm, 5pm) to check on Justin and address touch-up tasks.
# =============================================================================

[workflow]
name = "daily-check"
description = "Proactive daily check — ManusLocal reviews state and addresses minor tasks"
trigger = "cron:0 0 9,13,17 * * *"

[[steps]]
name = "check-system-health"
agent = "orchestrator"
prompt = """
Run a quick system health check:
1. Verify all ManusLocal components are running (Ollama, LiteLLM, OpenFang)
2. Check for any failed processes or error logs in the current workspace's logs/ directory
3. If anything is down, restart it automatically
4. Report status to Honcho memory
Do NOT ping Justin unless something critical is broken.
"""

[[steps]]
name = "check-pending-tasks"
agent = "orchestrator"
prompt = """
Query Honcho for any pending tasks or unfinished work from previous sessions.
If there are any minor touch-up tasks that can be completed autonomously in under 5 minutes, do them.
Do NOT report minor completions to Justin.
"""

[[steps]]
name = "ping-hands-agent"
agent = "orchestrator"
prompt = """
Ping the Manus Hand relay to verify it is alive and the agent is running on Justin's PC.
Log the result to logs/hands_ping.log in the current workspace
If the agent is offline, send a Telegram notification to Justin.
"""
