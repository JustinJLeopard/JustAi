# =============================================================================
# ManusLocal — Dev Pipeline Workflow
# Orchestrates the full software development pipeline.
# Trigger: manual (ml task 'build X')
# =============================================================================

[workflow]
name = "dev-pipeline"
description = "Full software development pipeline: Plan → Code → Review → Test"
trigger = "manual"

[[steps]]
name = "architecture-planning"
agent = "orchestrator"
prompt = """
Given the task, create a detailed architecture plan:
1. Query Honcho for developer preferences and existing project context
2. Break the task into clear subtasks
3. Identify which agent handles each subtask (Claude for architecture, Codex for code writing)
4. Output a structured plan to the current workspace's .dev-notepads/current_plan.md
"""

[[steps]]
name = "code-generation"
agent = "coder"
prompt = """
Execute the coding plan from .dev-notepads/current_plan.md:
1. Use mini-swe-agent for complex multi-file changes
2. Delegate to Codex CLI for code generation
3. Always verify generated code before committing
4. Use Claude for architectural review of complex decisions
"""

[[steps]]
name = "code-review"
agent = "orchestrator"
prompt = """
Review all generated code:
1. Check for correctness, style, and security issues
2. Run any available tests
3. If issues found, loop back to code-generation step
4. If approved, commit to git with a descriptive message
"""

[[steps]]
name = "memory-update"
agent = "orchestrator"
prompt = """
After completing the development task:
1. Flush .dev-notepads/ to Honcho
2. Update the session state with what was built
3. Store any new patterns or lessons learned in Honcho
"""
