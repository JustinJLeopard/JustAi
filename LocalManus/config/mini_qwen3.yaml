# =============================================================================
# ManusLocal — mini-swe-agent Configuration for Qwen3 30B-A3B (via Ollama)
# Use with: mini-local -t "your task"

model:
  model_name: qwen3:30b-a3b-q4_K_M
  model_class: litellm_textbased
  cost_tracking: ignore_errors
  model_kwargs:
    custom_llm_provider: ollama
    api_base: http://172.31.224.1:11434
    temperature: 0.7
    extra_body:
      think: false
  observation_template: |
    {% if output.exception_info -%}
    <exception>{{output.exception_info}}</exception>
    {% endif -%}
    <returncode>{{output.returncode}}</returncode>
    {% if output.output | length < 10000 -%}
    <output>
    {{ output.output -}}
    </output>
    {%- else -%}
    <warning>Output too long. Use head, tail, or grep to see parts of it.</warning>
    {%- set elided_chars = output.output | length - 10000 -%}
    <output_head>
    {{ output.output[:5000] }}
    </output_head>
    <elided_chars>{{ elided_chars }} characters elided</elided_chars>
    <output_tail>
    {{ output.output[-5000:] }}
    </output_tail>
    {%- endif -%}
  format_error_template: |
    FORMAT ERROR: {{error}}
    Your response MUST use EXACTLY this structure — nothing else is accepted:
    Brief reasoning sentence.
    ```mswea_bash_command
    the_command_to_run
    ```
    The code fence tag MUST be exactly `mswea_bash_command`. No other tag is valid.
    To submit a completed task:
    echo COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT
agent:
  step_limit: 30
  mode: confirm
  output_path: "${MINI_TRAJ_FILE:-~/projects/JustAi/LocalManus/logs/last_mini_run.traj.json}"
  system_template: |
    /no_think
    You are ManusLocal, an expert AI software engineering agent running on Linux.
    You complete tasks by issuing bash commands one at a time.
    ══════════════════════════════════════════════════════
    ACTION FORMAT — THIS IS THE ONLY VALID FORMAT:
    One sentence describing what you are doing.
    your_bash_command_here
    The tag MUST be `mswea_bash_command`. No other tag works. No plain backticks.
    One action per response. No <think> blocks. No tool_call JSON.
    TASK COMPLETION — MANDATORY RULE:
    When the task is done — meaning you have verified the output is correct —
    you MUST immediately submit by running this as your NEXT action:
    DO NOT run the same command again after seeing successful output.
    DO NOT ask for confirmation. Just submit.
    EXAMPLE — "print hello world in Python":
    Step 1 — Run the command:
    I will run Python to print hello world.
    python3 -c 'print("hello world")'
    [Output: hello world — task is done]
    Step 2 — Submit immediately:
    The output is correct, submitting now.
    Shell state does NOT persist between steps. Use `cd /path && command` as needed.
  instance_template: |
    TASK: {{task}}
    Complete the task, verify it works, then IMMEDIATELY submit with:
    Do not repeat steps after success. Submit as soon as the task is verified done.
    System: {{system}} {{release}} {{machine}}
environment:
  cwd: "${MINI_CWD:-~/projects}"
  environment_class: local
  env:
    PAGER: cat
    MANPAGER: cat
    LESS: -R
    PIP_PROGRESS_BAR: "off"
    TQDM_DISABLE: "1"
