# =============================================================================
# ManusLocal — OpenFang Configuration (Overlay for existing ~/.openfang/config.toml)
# This file EXTENDS the existing OpenFang config with ManusLocal-specific settings.
# Apply with: cp ~/.openfang/config.toml ~/.openfang/config.toml.bak &&
#             python3 /home/justinleopard/projects/JustAi/LocalManus/scripts/apply_openfang_config.py
# =============================================================================

# ── Model: Override to use Qwen3 via LiteLLM proxy ───────────────────────────
[model]
default_provider = "litellm"
default_model = "gpt-5.4"
task_complexity_routing = true

[providers.litellm]
# LiteLLM proxy bridges WSL → Ollama on Windows
api_base = "http://localhost:4000/v1"
api_key_env = "LITELLM_KEY"
models = ["gpt-5.4", "gpt-5.3-codex", "claude-opus-4-6", "claude-sonnet-4-6", "qwen3-local", "gpt-4o", "deepseek-chat", "gemini-flash", "groq-fast"]

# Keep existing providers as fallbacks
[providers.groq]
api_key_env = "GROQ_API_KEY"
models = ["llama-3.3-70b-versatile", "llama-3.1-8b-instant"]

[providers.gemini]
api_key_env = "GEMINI_API_KEY"
models = ["gemini-2.5-flash", "gemini-2.0-flash"]

[providers.deepseek]
api_key_env = "DEEPSEEK_API_KEY"
models = ["deepseek-chat"]

# ── Server: Keep existing port ────────────────────────────────────────────────
[server]
listen = "127.0.0.1:4200"

# ── Memory: Honcho integration ────────────────────────────────────────────────
[memory]
path = "~/.openfang/memory.db"

# ── Budget: Increase for local inference (it's free) ─────────────────────────
[budget]
enabled = true
daily_limit_usd = 5.00  # Only counts API calls, not local Ollama

# ── MCP: Add ManusLocal-specific servers ─────────────────────────────────────
[mcp]
enabled = true

# Keep existing MCP servers (github, notion, honcho, explorium, gmail)
# Add filesystem access
[[mcp.servers]]
name = "filesystem"
transport = "stdio"
command = "npx"
args = ["-y", "@modelcontextprotocol/server-filesystem", "/home/justinleopard"]

# ── Agents: ManusLocal orchestrator ──────────────────────────────────────────
[[agents]]
name = "manus-local-orchestrator"
template = "orchestrator"
model = "gpt-5.4"
system_prompt_file = "/home/justinleopard/projects/JustAi/LocalManus/persona/system_prompt.txt"

# ── Workflows: ManusLocal workflows ──────────────────────────────────────────
[workflows]
enabled = true
directory = "/home/justinleopard/projects/JustAi/LocalManus/workflows/"

# ── Channels ──────────────────────────────────────────────────────────────────
[[channels]]
name = "telegram"
type = "telegram"
bot_token_env = "TELEGRAM_BOT_TOKEN"
chat_id_env = "TELEGRAM_CHAT_ID"
enabled = true
