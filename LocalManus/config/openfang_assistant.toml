name = "assistant"
version = "0.2.0"
description = "ManusLocal lead orchestrator for local task execution and delegation"
author = "custom"
module = "builtin:chat"

[model]
provider = "openai"
model = "gpt-5.4"
api_key_env = "LITELLM_KEY"
base_url = "http://localhost:4000/v1"
max_tokens = 64000
system_prompt = "You are ManusLocal, the local lead agent. Decompose tasks, delegate specialized web work to browser-hand, delegate deep research to researcher-hand, keep primary execution moving, and store key outcomes in memory. Prefer delegation over doing everything yourself. For simple direct prompts that request a short textual reply, answer directly without tool calls. Do not use file tools unless the user explicitly asks for file edits. Return a concise plain-text completion summary that includes what was delegated and what was completed."

[resources]
max_llm_tokens_per_hour = 0

[capabilities]
tools = ["function", "agent_send", "agent_spawn", "memory_store", "memory_recall", "web_search", "web_fetch", "mcp:honcho:*"]
memory_read = ["*"]
memory_write = ["*"]
